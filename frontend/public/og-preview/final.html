<!doctype html>
<html><head><meta charset="utf-8"/><title>Final OG + favicon</title>
<style>
body{margin:0;background:#0c0b0a;color:#f7f3e9;font-family:Georgia,serif;padding:1.5rem}
h1{font-size:1.25rem} .row{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:flex-start}
.card{background:#161412;border:1px solid #2a241e;border-radius:12px;padding:1rem;max-width:640px}
img.og{width:100%;border-radius:8px} .icons{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.icons figure{margin:0;text-align:center;color:#a89880;font-size:.75rem}
.icons img{border-radius:8px;background:#1a1510;display:block}
.bubble{max-width:320px;background:#1e1a16;border-radius:14px;overflow:hidden;border:1px solid #2a241e}
.bubble .txt{padding:.65rem .8rem;font-size:.85rem}
.url{color:#a89880;font-size:.75rem}
</style></head><body>
<h1>Final: bend streamlines + sunset wash</h1>
<p>OG share card + tab/search icons. Local only.</p>
<div class="row">
  <div class="card" style="flex:2">
    <h2 style="margin-top:0;font-size:1rem;color:#a89880">Open Graph / link preview</h2>
    <img class="og" src="/og-image-3f.png?t=final" width="1200" height="630" alt="OG"/>
  </div>
  <div class="card">
    <h2 style="margin-top:0;font-size:1rem;color:#a89880">Chat simulation</h2>
    <div class="bubble">
      <img src="/og-image-3f.png?t=final" style="width:100%;display:block" alt=""/>
      <div class="txt"><strong>Fikiri Solutions</strong><div>AI-Powered Business Automation Platform</div><div class="url">fikirisolutions.com</div></div>
    </div>
  </div>
  <div class="card" style="width:100%">
    <h2 style="margin-top:0;font-size:1rem;color:#a89880">URL / search bar icons</h2>
    <div class="icons">
      <figure><img src="/favicon-32x32.png?t=final" width="32" height="32"/><figcaption>32×32</figcaption></figure>
      <figure><img src="/favicon-64x64.png?t=final" width="64" height="64"/><figcaption>64×64</figcaption></figure>
      <figure><img src="/apple-touch-icon.png?t=final" width="120" height="120"/><figcaption>Apple touch</figcaption></figure>
      <figure><img src="/pwa-192x192.png?t=final" width="120" height="120"/><figcaption>PWA 192</figcaption></figure>
      <figure><img src="/pwa-512x512.png?t=final" width="160" height="160"/><figcaption>PWA 512</figcaption></figure>
    </div>
  </div>
</div>
</body></html>
