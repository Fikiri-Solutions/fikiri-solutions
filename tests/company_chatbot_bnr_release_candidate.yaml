    language_category: standard_en
    provenance: {source: release_candidate_v1, review_status: awaiting_independent_labels, used_for_tuning: false}
    turns: [{user: "Our service vans keep overlapping appointments on the same afternoon."}]
    expected:
      need_ids_any: [scheduling_dispatch]
