# Fikiri Conversational Robustness Benchmark — Pilot (FCRB v0)
# Independent of golden retrieval YAML. Labels are engineer-drafted for pilot grading;
# review_status=draft_unvalidated until dual human review.
schema_version: fcrb_pilot_v1
suite: customer_realism_pilot
case_count_target: 50

cases:
  # ---------- 10 standard customer questions ----------
  - id: fcrb_std_pricing_01
    category: standard
    language_category: standard_en
    provenance: {source: engineer_authored_independent, review_status: draft_unvalidated, independent_of_golden: true}
    turns:
      - user: How much does your platform cost each month?
    expected:
      intent: pricing_inquiry
      modes_allowed: [answer]
      fallback_forbidden: true
      required_substrings_any: ["$", "month", "plan", "Starter", "49"]
      forbidden_substrings: ["HIPAA certified", "guaranteed ROI"]
      acceptable_source_ids_any: [pricing_overview, pricing_starter, faq_plan_fit]
      human_review: answer_quality

  - id: fcrb_std_email_01
    category: standard
    language_category: standard_en
    provenance: {source: engineer_authored_independent, review_status: draft_unvalidated, independent_of_golden: true}
    turns:
      - user: Can your AI assistant respond to customer emails?
    expected:
      intent: email_assistant
      modes_allowed: [answer]
      fallback_forbidden: true
      required_substrings_any: ["email", "Gmail", "Outlook", "inbox", "replies", "assistant"]
      acceptable_source_ids_any: [product_ai_email_assistant, product_email_overview, product_email_draft]
      human_review: answer_quality

