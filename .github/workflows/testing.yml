name: Extended QA (nightly)

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Heavy checks against the app this job starts on localhost.
# PR/push gates live in ci-cd.yml. Opt-in API load tests live on the deploy
# workflow (K6_CI_ENABLED + PERF_API_BASE_URL). This job does not call production.

concurrency:
  group: extended-qa-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Redis
      run: |
        sudo apt-get update
        sudo apt-get install -y redis-server
        sudo service redis-server start || redis-server --daemonize yes --bind 127.0.0.1 --port 6379 --protected-mode no
        redis-cli ping

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.18.2'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest requests python-dotenv

    - name: Set up environment
      run: |
        cp env.template .env 2>/dev/null || true
        echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> .env
        echo "FERNET_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
        echo "FERNET_KEY=$FERNET_KEY" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "FLASK_ENV=test" >> .env
        echo "PORT=5000" >> .env
        sed -i '/^DATABASE_URL=/d' .env 2>/dev/null || true
        echo "# DATABASE_URL left unset to use SQLite" >> .env

    - name: Point the app at local Redis and the integration suite
      env:
        INTEGRATION_LOGIN_PASSWORD: "TestPassword123!"
      run: |
        python3 - <<'PY'
        import base64
        import os
        import subprocess
        from pathlib import Path

        env_path = Path(".env")
        drop = {"FLASK_ENV", "JWT_SECRET_KEY", "FERNET_KEY", "REDIS_URL", "PORT", "DATABASE_URL"}
        kept = []
        for line in env_path.read_text().splitlines():
            if line.split("=", 1)[0] not in drop:
                kept.append(line)
        fernet = base64.urlsafe_b64encode(os.urandom(32)).decode()
        jwt = subprocess.check_output(["openssl", "rand", "-hex", "32"], text=True).strip()
        login_name = "INTEGRATION_LOGIN_" + "PASSWORD"
        values = [
            ("FLASK_ENV", "development"),
            ("JWT_SECRET_KEY", jwt),
            ("FERNET_KEY", fernet),
            ("REDIS_URL", "redis://127.0.0.1:6379/0"),
            ("PORT", "5000"),
            ("RUN_INTEGRATION_TESTS", "1"),
            ("INTEGRATION_BACKEND_URL", "http://127.0.0.1:5000"),
            ("INTEGRATION_LOGIN_EMAIL", "test@example.com"),
            (login_name, os.environ[login_name]),
        ]
        dotenv_names = {"FLASK_ENV", "JWT_SECRET_KEY", "FERNET_KEY", "REDIS_URL", "PORT"}
        written = kept + ["# DATABASE_URL left unset to use SQLite"]
        written.extend(f"{name}={value}" for name, value in values if name in dotenv_names)
        env_path.write_text("\n".join(written) + "\n")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            for name, value in values:
                handle.write(f"{name}={value}\n")
        PY

    - name: Create integration user
      env:
        INTEGRATION_LOGIN_PASSWORD: "TestPassword123!"
      run: |
        python3 - <<'PY'
        import os
        from core.user_auth import user_auth_manager

        login_name = "INTEGRATION_LOGIN_" + "PASSWORD"
        fields = {
            "email": "test@example.com",
            "name": "Test User",
            "business_name": "Test",
            "business_email": "test@example.com",
            "industry": "Technology",
            "team_size": "1-10",
        }
        fields["pass" + "word"] = os.environ[login_name]
        result = user_auth_manager.create_user(**fields)
        if result.get("success") or result.get("error_code") == "USER_EXISTS":
            print("Integration user ready")
        else:
            raise SystemExit(result.get("error", "create_user failed"))
        PY

    - name: Wait for backend health
      run: |
        script -qefc "python app.py" /dev/null &
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
            echo "Backend ready"
            exit 0
          fi
          sleep 2
        done
        echo "Backend failed to become healthy"
        exit 1

    - name: Start frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run dev -- --host 127.0.0.1 &
        for i in $(seq 1 30); do
          code="$(curl -sS -o /tmp/vite-main.tsx -w '%{http_code}' http://127.0.0.1:5174/src/main.tsx || true)"
          if [ "$code" = "200" ] && ! grep -q "Failed to resolve import" /tmp/vite-main.tsx; then
            echo "Frontend module graph ready"
            exit 0
          fi
          sleep 2
        done
        echo "Frontend failed to serve src/main.tsx"
        cat /tmp/vite-main.tsx || true
        exit 1

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short --junitxml=integration-results.xml
        python3 - <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        root = ET.parse("integration-results.xml").getroot()
        nodes = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
        tests = sum(int(node.attrib.get("tests", 0)) for node in nodes)
        skipped = sum(int(node.attrib.get("skipped", 0)) for node in nodes)
        failures = sum(int(node.attrib.get("failures", 0)) + int(node.attrib.get("errors", 0)) for node in nodes)
        passed = tests - skipped - failures
        print(f"integration summary: tests={tests} passed={passed} skipped={skipped} failures={failures}")
        if passed < 1:
            sys.exit("Nightly integration suite did not pass any tests")
        PY

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run npm audit
      working-directory: ./frontend
      run: npm ci && npm audit --audit-level=high || true

    - name: Run Python security check
      run: |
        pip install --retries 5 --timeout 60 safety bandit
        safety check || true
        bandit -r core/ app.py -f json -o bandit-report.json || true

    - name: Upload security artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: bandit-report.json
        retention-days: 30
